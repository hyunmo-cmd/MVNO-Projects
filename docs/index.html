<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>혜택 발송기</title>
  <style>
    :root {
      --ink: #0f172a;
      --ink2: #1e293b;
      --muted: #64748b;
      --line: #e2e8f0;
      --line2: #f1f5f9;
      --panel: #ffffff;
      --bg: #f1f5f9;
      --blue: #2563eb;
      --blue-d: #1d4ed8;
      --blue2: #eff6ff;
      --green: #dcfce7;
      --green-ink: #166534;
      --rose: #fee2e2;
      --rose-ink: #9f1239;
      --shadow-sm: 0 1px 3px rgba(15,23,42,.08), 0 1px 2px rgba(15,23,42,.04);
      --r: 10px;
      --r-sm: 6px;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif;
      font-size: 14px;
      color: var(--ink);
      background: var(--bg);
    }
    input, select, button { font: inherit; color: inherit; }

    /* ─── 헤더 ─── */
    .app-header { background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%); color: #fff; }
    .app-header-inner, .page, .action-inner { max-width: 1180px; margin: 0 auto; padding-left: 24px; padding-right: 24px; }
    .app-header-inner { padding-top: 18px; padding-bottom: 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
    .sub { margin-top: 4px; color: #94a3b8; font-size: 12.5px; }

    /* ─── 공통 컨트롤 ─── */
    .input {
      width: 100%;
      min-height: 38px;
      border: 1px solid #cbd5e1;
      border-radius: var(--r-sm);
      padding: 0 11px;
      background: #fff;
      transition: border-color .15s, box-shadow .15s;
    }
    .input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
    .input:disabled { background: #f8fafc; color: var(--muted); cursor: not-allowed; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 38px;
      padding: 0 16px;
      border: 1px solid #cbd5e1;
      border-radius: var(--r-sm);
      background: #fff;
      color: var(--ink2);
      font-weight: 600;
      font-size: 13.5px;
      white-space: nowrap;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .btn:hover:not(:disabled) { background: #f8fafc; border-color: #94a3b8; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--blue-d); border-color: var(--blue-d); }
    .btn-sm { min-height: 30px; padding: 0 10px; font-size: 12.5px; }
    .btn-danger { color: #be123c; }
    .btn-danger:hover:not(:disabled) { background: #fff1f2; border-color: #fda4af; }
    .btn-on-dark { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.35); color: #fff; }
    .btn-on-dark:hover:not(:disabled) { background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.6); }
    .link-btn { background: none; border: none; padding: 0; color: var(--blue); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
    .muted { color: var(--muted); font-size: 12.5px; }
    .mono { font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size: 12.5px; }

    /* ─── 메인 ─── */
    .page { padding-top: 20px; padding-bottom: 24px; display: grid; gap: 16px; }
    .section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow-sm);
      padding: 20px;
    }
    .setup { display: grid; gap: 20px; }
    .setup > *, .page > * { min-width: 0; }
    select.input { min-width: 0; text-overflow: ellipsis; }
    .step-label { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-weight: 700; font-size: 14px; color: var(--ink2); }
    .num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      background: var(--blue);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .benefit-meta { margin-top: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 12.5px; color: var(--muted); }
    .benefit-meta:empty { display: none; }
    .notice { margin-top: 8px; padding: 10px 14px; border: 1px solid #bfdbfe; border-radius: var(--r-sm); background: var(--blue2); color: #1e40af; font-size: 13px; }
    .upload-row { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 12px; }
    .dropzone {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      min-height: 78px;
      padding: 14px 18px;
      border: 1.5px dashed #94a3b8;
      border-radius: var(--r);
      background: #f8fafc;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .dropzone:hover, .dropzone:focus-visible, .dropzone.drag { border-color: var(--blue); background: var(--blue2); outline: none; }
    .dropzone.loaded { border-style: solid; border-color: #86efac; background: #f0fdf4; }
    .dropzone.busy { cursor: progress; }
    .dz-main { font-weight: 600; color: var(--ink2); word-break: break-all; }
    .dz-sub { font-size: 12px; color: var(--muted); }
    .pw-field label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
    .status { margin-top: 10px; padding: 9px 12px; border: 1px solid transparent; border-radius: var(--r-sm); font-size: 12.5px; line-height: 1.55; }
    .status:empty { display: none; }
    .status[data-tone="info"] { background: #f8fafc; border-color: var(--line); color: #334155; }
    .status[data-tone="busy"] { background: var(--blue2); border-color: #bfdbfe; color: #1e40af; }
    .status[data-tone="ok"] { background: #f0fdf4; border-color: #bbf7d0; color: var(--green-ink); }
    .status[data-tone="warn"] { background: #fffbeb; border-color: #fde68a; color: #92400e; }
    .status[data-tone="error"] { background: #fff1f2; border-color: #fecdd3; color: var(--rose-ink); }

    /* ─── 대상자 확인 ─── */
    .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .section-head .step-label { margin: 0; }
    .metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .metric { padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-sm); }
    .metric .k { font-size: 12px; font-weight: 600; color: var(--muted); }
    .metric .v { margin-top: 6px; font-size: 24px; font-weight: 800; line-height: 1.1; }
    .metric.primary { background: var(--blue2); border-color: #bfdbfe; }
    .metric.primary .k, .metric.primary .v { color: var(--blue-d); }
    .check-line { margin-top: 10px; font-size: 12.5px; }
    .check-line:empty { display: none; }
    .check-line.ok { color: #15803d; }
    .check-line.bad { color: #b45309; font-weight: 600; }
    .table-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 14px 0 10px; }
    .table-tools .search { flex: 1 1 220px; width: auto; }
    .table-tools select.input { flex: 0 1 230px; width: auto; }
    .seg { display: inline-flex; flex-shrink: 0; border: 1px solid #cbd5e1; border-radius: var(--r-sm); overflow: hidden; }
    .seg button { min-height: 36px; padding: 0 12px; border: none; background: #fff; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; }
    .seg button + button { border-left: 1px solid #cbd5e1; }
    .seg button.on { background: var(--ink2); color: #fff; }
    .seg button:disabled { cursor: not-allowed; }
    .table-wrap { max-height: 560px; overflow: auto; border: 1px solid var(--line); border-radius: var(--r-sm); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; }
    th, td { padding: 9px 12px; border-bottom: 1px solid var(--line2); text-align: left; white-space: nowrap; }
    th { position: sticky; top: 0; z-index: 1; background: #f8fafc; color: var(--muted); font-size: 12px; font-weight: 700; border-bottom: 1px solid var(--line); }
    tbody tr:hover td { background: #f8fafc; }
    td.empty { padding: 40px 12px; text-align: center; color: var(--muted); white-space: normal; }
    .badge { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; background: var(--green); color: var(--green-ink); font-size: 11.5px; font-weight: 700; }
    .badge.other { background: var(--rose); color: var(--rose-ink); }
    .reason { color: #b45309; font-weight: 600; }
    .phone-warn { margin-left: 4px; color: #b45309; cursor: help; }
    .table-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; }

    /* ─── 하단 실행 바 ─── */
    .action-bar {
      position: sticky;
      bottom: 0;
      z-index: 5;
      background: rgba(255,255,255,.97);
      border-top: 1px solid var(--line);
      box-shadow: 0 -2px 10px rgba(15,23,42,.06);
    }
    .action-inner { padding-top: 12px; padding-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .action-hint { font-size: 13px; color: var(--muted); min-width: 0; }
    .action-hint strong { color: var(--ink); }
    .action-hint a { margin-left: 8px; color: var(--blue); font-weight: 600; }
    .actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .split { position: relative; display: inline-flex; }
    .split > .btn-primary:first-child { border-radius: var(--r-sm) 0 0 var(--r-sm); }
    .split > .split-toggle { padding: 0 11px; border-left-color: rgba(255,255,255,.4); border-radius: 0 var(--r-sm) var(--r-sm) 0; }
    .menu {
      position: absolute;
      right: 0;
      bottom: calc(100% + 6px);
      z-index: 20;
      min-width: 240px;
      padding: 4px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      box-shadow: 0 8px 24px rgba(15,23,42,.14);
    }
    .menu button { display: block; width: 100%; padding: 9px 12px; border: none; border-radius: 4px; background: none; text-align: left; font-size: 13px; font-weight: 600; color: var(--ink2); cursor: pointer; }
    .menu button:hover:not(:disabled) { background: var(--bg); }
    .menu button:disabled { color: #94a3b8; cursor: not-allowed; }
    .menu .menu-sub { display: block; margin-top: 2px; font-size: 11.5px; font-weight: 400; color: var(--muted); }

    /* ─── 혜택 관리 팝업 ─── */
    dialog.modal {
      width: min(980px, calc(100vw - 32px));
      max-height: min(88vh, 920px);
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(15,23,42,.25);
      color: var(--ink);
    }
    dialog.modal[open] { display: flex; flex-direction: column; overflow: hidden; }
    dialog.modal::backdrop { background: rgba(15,23,42,.45); }
    .modal-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
    .modal-head h2 { margin: 0; font-size: 16px; color: var(--ink2); }
    .modal-head .spacer { flex: 1; }
    .unsaved { font-size: 12px; font-weight: 600; color: #b45309; }
    .icon-btn { width: 32px; height: 32px; border: none; border-radius: var(--r-sm); background: none; color: var(--muted); font-size: 17px; cursor: pointer; }
    .icon-btn:hover { background: var(--bg); color: var(--ink); }
    .modal-body { flex: 1; min-height: 0; padding: 16px 18px; overflow-y: auto; }
    .modal-foot { display: flex; align-items: center; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); background: #f8fafc; flex-shrink: 0; }
    .modal-foot .foot-msg { margin-right: auto; font-size: 12.5px; font-weight: 600; color: #be123c; }
    .mgr-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
    .mgr-tools .search { flex: 1 1 240px; width: auto; }
    .mgr-tools .status { margin: 0; flex-basis: 100%; }
    .mgr-table-wrap { border: 1px solid var(--line); border-radius: var(--r-sm); overflow: auto; }
    .mgr-table td { vertical-align: middle; }
    .mgr-table .b-name { min-width: 220px; white-space: normal; font-weight: 600; }
    .mgr-table .b-sub { margin-top: 2px; font-size: 11.5px; font-weight: 400; color: var(--muted); }
    .mgr-table tr.inactive .b-name { color: var(--muted); }
    .mgr-table .col-act { width: 1%; }
    .pill { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border: 1px solid; border-radius: 999px; background: none; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
    button.pill { cursor: pointer; }
    .pill.net-lg { background: #eef2ff; color: #4338ca; border-color: #c7d2fe; }
    .pill.net-kt { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
    .pill.net-mixed { background: #fef9c3; color: #854d0e; border-color: #fde68a; }
    .pill.on { background: #dcfce7; color: #15803d; border-color: #86efac; }
    .pill.off { background: #f1f5f9; color: #94a3b8; border-color: #cbd5e1; }
    .form-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 14px; }
    .form-grid .span-all { grid-column: 1 / -1; }
    .form-grid .span-2 { grid-column: span 2; }
    .form-item label { display: block; margin-bottom: 5px; font-size: 12px; font-weight: 600; color: var(--muted); }
    .form-item .req { color: #be123c; }
    .hint { margin-top: 4px; font-size: 11.5px; color: var(--muted); }
    .form-section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 24px 0 10px; font-size: 14px; font-weight: 700; color: var(--ink2); }
    .plan-add { position: relative; display: flex; gap: 8px; }
    .suggest {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 4px);
      z-index: 5;
      max-height: 260px;
      overflow-y: auto;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      box-shadow: 0 8px 24px rgba(15,23,42,.14);
    }
    .suggest-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line2); font-size: 13px; cursor: pointer; }
    .suggest-item:hover { background: var(--blue2); }
    .suggest-item.done { opacity: .55; cursor: default; }
    .suggest-item.done:hover { background: none; }
    .suggest-item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .suggest-item .tag { flex-shrink: 0; font-size: 11.5px; color: var(--muted); }
    .suggest-empty { padding: 12px; font-size: 12.5px; color: var(--muted); }
    .plan-add-msg { margin-top: 6px; font-size: 12px; color: var(--muted); }
    .plan-add-msg:empty { display: none; }
    .plan-table-wrap { margin-top: 10px; max-height: 340px; overflow: auto; border: 1px solid var(--line); border-radius: var(--r-sm); }
    .plan-table td { padding: 6px 10px; }
    .plan-table .plan-name-input { min-width: 260px; min-height: 32px; font-size: 13px; }
    .icon-del { width: 28px; height: 28px; border: none; border-radius: var(--r-sm); background: none; color: var(--muted); font-size: 14px; cursor: pointer; }
    .icon-del:hover { background: #fff1f2; color: #be123c; }

    @media (max-width: 760px) {
      .app-header-inner, .page, .action-inner { padding-left: 16px; padding-right: 16px; }
      .upload-row, .form-grid { grid-template-columns: 1fr; }
      .form-grid .span-2 { grid-column: auto; }
      .metric .v { font-size: 20px; }
      .table-tools select.input { flex: 1 1 140px; }
      .action-inner { flex-direction: column; align-items: stretch; }
      .actions { justify-content: flex-end; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <div>
        <h1>혜택 발송기</h1>
        <div class="sub">혜택별 발송 대상자를 간편하게 추출합니다.</div>
      </div>
      <button type="button" id="openManagerBtn" class="btn btn-on-dark">혜택 관리</button>
    </div>
  </header>

  <main class="page">
    <section class="section setup">
      <div>
        <label class="step-label" for="benefitSelect"><span class="num">1</span>혜택 선택</label>
        <select id="benefitSelect" class="input"></select>
        <div id="benefitMeta" class="benefit-meta"></div>
        <div id="noBenefitNotice" class="notice" hidden>
          등록된 혜택이 없습니다. <button type="button" class="link-btn" id="noBenefitAddBtn">혜택 등록하기</button>
        </div>
      </div>
      <div>
        <div class="step-label"><span class="num">2</span>개통내역 파일 업로드</div>
        <div class="upload-row">
          <div id="dropZone" class="dropzone" tabindex="0" role="button" aria-label="개통내역 파일 선택">
            <div class="dz-main" id="dzMain"></div>
            <div class="dz-sub" id="dzSub"></div>
          </div>
          <div class="pw-field">
            <label for="passwordInput">파일 암호 (암호화 파일만)</label>
            <input id="passwordInput" class="input" type="password" autocomplete="off" placeholder="입력 후 Enter" />
          </div>
        </div>
        <input id="fileInput" type="file" accept=".xlsx,.xlsm,.xls" autocomplete="off" hidden />
        <div id="statusBox" class="status" data-tone="info"></div>
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <div class="step-label"><span class="num">3</span>발송 대상자 확인</div>
        <span class="muted" id="resultBenefitLabel"></span>
      </div>
      <div class="metrics">
        <div class="metric"><div class="k">전체 고객 수</div><div class="v" id="mTotal">-</div></div>
        <div class="metric"><div class="k">혜택 조건 일치</div><div class="v" id="mMatched">-</div></div>
        <div class="metric primary"><div class="k">최종 발송 대상자</div><div class="v" id="mFinal">-</div></div>
      </div>
      <div id="checkLine" class="check-line"></div>
      <div class="table-tools">
        <div class="seg" id="viewSeg">
          <button type="button" data-view="targets" class="on">발송 대상 <span id="segTargets">0</span></button>
          <button type="button" data-view="excluded">제외 <span id="segExcluded">0</span></button>
        </div>
        <input id="customerSearch" class="input search" type="search" placeholder="고객명, 연락처, 요금제 검색" />
        <select id="planCode" class="input" title="요금제코드 조건 (발송 파일에 반영)"></select>
        <select id="statusFilter" class="input" title="고객 상태 조건 (발송 파일에 반영)">
          <option value="all">상태: 전체</option>
          <option value="정상">상태: 정상만</option>
          <option value="other">상태: 정상 외</option>
        </select>
      </div>
      <div class="table-wrap">
        <table>
          <thead id="customerHead"></thead>
          <tbody id="customerRows"></tbody>
        </table>
      </div>
      <div class="table-foot">
        <span class="muted" id="rangeLabel"></span>
        <button type="button" id="loadMoreRowsBtn" class="btn btn-sm" hidden>더보기</button>
      </div>
    </section>
  </main>

  <footer class="action-bar">
    <div class="action-inner">
      <div class="action-hint">
        <span id="actionHint"></span>
        <a id="downloadFallbackLink" href="#" download hidden>다시 다운로드</a>
      </div>
      <div class="actions">
        <button type="button" id="resetBtn" class="btn">초기화</button>
        <div class="split">
          <button type="button" id="downloadBtn" class="btn btn-primary" disabled>발송 파일 다운로드</button>
          <button type="button" id="downloadMoreBtn" class="btn btn-primary split-toggle" aria-label="다른 형식으로 다운로드" aria-haspopup="menu" disabled>▾</button>
          <div class="menu" id="downloadMenu" role="menu" hidden>
            <button type="button" role="menuitem" data-dl="xls">선택 혜택 엑셀 (.xls)<span class="menu-sub">발송 컬럼 + 개통일·상태·개통구분</span></button>
            <button type="button" role="menuitem" data-dl="all">전체 혜택 엑셀 (.xls)<span class="menu-sub">모든 혜택의 대상자를 혜택별 시트로</span></button>
          </div>
        </div>
      </div>
    </div>
  </footer>

  <dialog id="managerDialog" class="modal" aria-labelledby="managerTitle">

      let ptr = readUint32(data, eocd + 16);
      const entries = {};
      for (let i = 0; i < total; i++) {
        if (readUint32(data, ptr) !== 0x02014b50) throw new Error("xlsx 중앙 디렉터리를 읽지 못했습니다.");
        const method = readUint16(data, ptr + 10);
        const compressedSize = readUint32(data, ptr + 20);
        const nameLen = readUint16(data, ptr + 28);
        const extraLen = readUint16(data, ptr + 30);
        const commentLen = readUint16(data, ptr + 32);
        const localOffset = readUint32(data, ptr + 42);
        const name = enc.decode(data.slice(ptr + 46, ptr + 46 + nameLen));
        const localNameLen = readUint16(data, localOffset + 26);
        const localExtraLen = readUint16(data, localOffset + 28);
        const start = localOffset + 30 + localNameLen + localExtraLen;
        const compressed = data.slice(start, start + compressedSize);
        let bytes;
        if (method === 0) bytes = compressed;
        else if (method === 8) bytes = await inflateRaw(compressed);
        else throw new Error("지원하지 않는 xlsx 압축 방식입니다.");
        entries[name] = bytes;
        ptr += 46 + nameLen + extraLen + commentLen;
      }
      return entries;
    }

    function xmlDoc(text) {
      return new DOMParser().parseFromString(text, "application/xml");
    }
    function childText(node, tag) {
      const child = node.getElementsByTagName(tag)[0];
      return child ? child.textContent : "";
    }
    function colIndex(ref) {
      const letters = String(ref || "").match(/[A-Z]+/i)?.[0] || "";
      let n = 0;
      for (const ch of letters.toUpperCase()) n = n * 26 + ch.charCodeAt(0) - 64;
      return n - 1;
    }
    function parseSharedStrings(entries) {
      const raw = entries["xl/sharedStrings.xml"];
      if (!raw) return [];
      const doc = xmlDoc(enc.decode(raw));
      return Array.from(doc.getElementsByTagName("si")).map((si) => Array.from(si.getElementsByTagName("t")).map((t) => t.textContent).join(""));
    }
    function resolveFirstSheet(entries) {
      if (!entries["xl/workbook.xml"]) return "xl/worksheets/sheet1.xml";
      const workbook = xmlDoc(enc.decode(entries["xl/workbook.xml"]));
      const firstSheet = workbook.getElementsByTagName("sheet")[0];
      const relId = firstSheet?.getAttribute("r:id");
      if (!relId || !entries["xl/_rels/workbook.xml.rels"]) return "xl/worksheets/sheet1.xml";
      const rels = xmlDoc(enc.decode(entries["xl/_rels/workbook.xml.rels"]));
      for (const rel of rels.getElementsByTagName("Relationship")) {
        if (rel.getAttribute("Id") === relId) {
          const target = rel.getAttribute("Target") || "worksheets/sheet1.xml";
          return "xl/" + target.replace(/^\/?xl\//, "");
        }
      }
      return "xl/worksheets/sheet1.xml";
    }
    function parseSheet(entries, sheetPath, shared) {
      const raw = entries[sheetPath];
      if (!raw) throw new Error("첫 번째 시트를 찾지 못했습니다.");
      const doc = xmlDoc(enc.decode(raw));
      const rows = [];
      for (const rowNode of doc.getElementsByTagName("row")) {
        const row = [];
        for (const cell of rowNode.getElementsByTagName("c")) {
          const idx = colIndex(cell.getAttribute("r"));
          const type = cell.getAttribute("t");
          let value = "";
          if (type === "s") {
            const n = Number(childText(cell, "v"));
            value = shared[n] || "";
          } else if (type === "inlineStr") {
            value = Array.from(cell.getElementsByTagName("t")).map((t) => t.textContent).join("");
          } else {
            value = childText(cell, "v");
          }
          row[idx] = value;
        }
        rows.push(row.map((v) => v ?? ""));
      }
      return rows;
    }
    function normalizeDate(value) {
      if (!value) return "";
      const text = String(value).trim();
      if (/^\d{2}\/\d{2}\/\d{2}/.test(text)) return "20" + text.replace(/\//g, "-").slice(0, 14);
      if (/^\d{4}-\d{2}-\d{2}/.test(text)) return text.slice(0, 16);
      return text;
    }
    function findIndex(headers, name) {
      return headers.findIndex((h) => String(h || "").trim() === name);
    }
    function loadRows(rows) {
      const headers = rows[0] || [];
      const map = {
        phone: findIndex(headers, "개통번호"),
        name: findIndex(headers, "고객명"),
        planCode: findIndex(headers, "요금제코드"),
        planName: findIndex(headers, "요금제명"),
        openedAt: findIndex(headers, "개통일"),
        status: findIndex(headers, "상태"),
        joinType: findIndex(headers, "개통구분"),
        agency: findIndex(headers, "대리점"),
        channel: findIndex(headers, "총판")
      };
      const missing = [["개통번호", map.phone], ["고객명", map.name], ["요금제코드", map.planCode]].filter(([, idx]) => idx < 0).map(([label]) => label);
      if (missing.length) {
        throw new Error(`필수 컬럼(${missing.join(", ")})을 찾지 못했습니다. 첫 번째 시트의 1행에 개통번호, 고객명, 요금제코드 컬럼명이 있어야 합니다.`);
      }
      const allParsed = rows.slice(1).filter((row) => row.some(Boolean)).map((row) => ({
        phone: row[map.phone] || "",
        name: row[map.name] || "",
        planCode: row[map.planCode] || "",
        planName: row[map.planName] || "",
        openedAt: normalizeDate(row[map.openedAt]),
        status: row[map.status] || "",
        joinType: row[map.joinType] || "",
        agency: row[map.agency] || "",
        channel: row[map.channel] || ""
      }));
      if (!allParsed.length) throw new Error("첫 번째 시트에 고객 데이터가 없습니다.");
      state.customers = allParsed.filter((row) => row.planCode);
      state.uploadStats = computeUploadStats(allParsed);
      buildPlansFromCustomers();
    }
    function buildPlansFromCustomers() {
      const grouped = new Map();
      for (const row of state.customers) {
        if (!grouped.has(row.planCode)) grouped.set(row.planCode, []);
        grouped.get(row.planCode).push(row);
      }
      state.plans = Array.from(grouped, ([code, list]) => ({
        code,
        name: list[0].planName,
        total: list.length,
        normal: list.filter((row) => row.status === "정상").length
      })).sort((a, b) => b.total - a.total || a.code.localeCompare(b.code));
    }
    function allKnownPlans() {
      const pool = new Map();
      for (const p of state.plans) {
        pool.set(p.code, { code: p.code, name: p.name || "", count: p.total || 0 });
      }
      for (const item of state.mappings) {
        if (!item.planCode) continue;
        if (!pool.has(item.planCode)) pool.set(item.planCode, { code: item.planCode, name: item.planName || "", count: 0 });
        else if (!pool.get(item.planCode).name && item.planName) pool.get(item.planCode).name = item.planName;
      }
      return Array.from(pool.values()).sort((a, b) => a.code.localeCompare(b.code));
    }

    // ─── 파일 업로드 ───
    function needPasswordError() {
      const error = new Error("암호화된 파일입니다. 오른쪽에 파일 암호를 입력하고 Enter를 눌러 주세요.");
      error.code = "NEED_PASSWORD";
      return error;
    }
    async function handleFile(file) {
      const password = $("passwordInput").value.trim();
      setStatus("파일을 이 브라우저 안에서 읽는 중입니다…", "busy");
      let buffer = await file.arrayBuffer();
      const head = new Uint8Array(buffer.slice(0, 8));
      if (head[0] === 0xd0 && head[1] === 0xcf && head[2] === 0x11 && head[3] === 0xe0) {
        const streams = parseCfb(buffer);
        if (!streams.EncryptionInfo || !streams.EncryptedPackage) {
          throw new Error("구버전 엑셀(.xls) 형식은 읽을 수 없습니다. 엑셀에서 [다른 이름으로 저장 → Excel 통합 문서(.xlsx)]로 저장한 뒤 다시 올려 주세요.");
        }
        if (!password) throw needPasswordError();
        setStatus("암호화된 엑셀을 이 브라우저 안에서 해제하는 중입니다…", "busy");
        buffer = await decryptOfficeFile(buffer, password);
      }
      const entries = await unzipEntries(buffer);
      const shared = parseSharedStrings(entries);
      const sheetPath = resolveFirstSheet(entries);
      const rows = parseSheet(entries, sheetPath, shared);
      loadRows(rows);
      state.fileName = file.name;
      const stats = state.uploadStats;
      const base = `${number(stats.total)}건을 불러왔습니다.${password ? " 입력한 암호는 저장하지 않습니다." : ""}`;
      if (stats.needsReview > 0) {
        const parts = [];
        if (stats.missingPhone) parts.push(`전화번호 누락 ${number(stats.missingPhone)}건`);
        if (stats.duplicatePhone) parts.push(`중복 전화번호 ${number(stats.duplicatePhone)}건`);
        if (stats.missingPlanCode) parts.push(`요금제코드 누락 ${number(stats.missingPlanCode)}건(대상 제외)`);
        if (stats.unmatchedPlanCode) parts.push(`등록되지 않은 요금제코드 ${number(stats.unmatchedPlanCode)}건`);
        if (stats.invalidPhoneFormat) parts.push(`전화번호 형식 오류 ${number(stats.invalidPhoneFormat)}건`);
        setStatus(`${base} 확인이 필요한 데이터 ${number(stats.needsReview)}건: ${parts.join(" · ")}`, "warn");
      } else {
        setStatus(base, "ok");
      }
    }
    function friendlyError(error) {
      const message = String(error?.message || "");
      return /[가-힣]/.test(message) ? message : "파일을 읽는 중 오류가 발생했습니다. 파일이 손상되지 않았는지, 암호가 맞는지 확인해 주세요.";
    }
    function clearCustomerData() {
      state.customers = [];
      state.plans = [];
      state.fileName = "";
      state.uploadStats = null;
      resetResultFilters();
      revokeDownload();
    }
    async function processFile(file) {
      if (!file || state.processing) return;
      if (!/\.(xlsx|xlsm|xls)$/i.test(file.name)) {
        setStatus(`엑셀 파일(.xlsx)만 업로드할 수 있습니다. 선택한 파일: ${file.name}`, "error");
        return;
      }
      pendingFile = file;
      clearCustomerData();
      state.processing = true;
      render();
      try {
        await handleFile(file);
        pendingFile = null;
      } catch (error) {
        clearCustomerData();
        if (error.code === "NEED_PASSWORD") {
          setStatus(error.message, "warn");
          $("passwordInput").focus();
        } else {
          setStatus(friendlyError(error), "error");
          if ($("passwordInput").value) $("passwordInput").select();
        }
      } finally {
        state.processing = false;
        $("fileInput").value = "";
        render();
      }
    }
    function clearSession() {
      clearCustomerData();
      pendingFile = null;
      $("fileInput").value = "";
      $("passwordInput").value = "";
      setStatus("");
      render();
    }

    // ─── 대상자 추출 ───
    function resetResultFilters() {
      state.planCode = "";
      state.search = "";
      state.status = "all";
      state.view = "targets";
      state.visibleRows = PAGE_SIZE;
      $("customerSearch").value = "";
      $("statusFilter").value = "all";
    }
    // 기존 추출 규칙: 혜택(또는 선택한 요금제코드)에 매칭된 고객 중 지급기간이 끝나지 않았고 상태 조건에 맞는 고객이 최종 대상.
    function analyze() {
      const group = selectedCategory();
      if (!group || !state.customers.length) return { group, matched: [], targets: [], excluded: [] };
      const codes = new Set(selectedPlanCodes());
      const matched = state.customers.filter((row) => codes.has(row.planCode));
      const targets = [];
      const excluded = [];
      for (const row of matched) {
        if (isBenefitEnded(row, group.durationMonths)) {
          excluded.push({ row, reason: `지급기간 종료 (개통 ${row.openedAt.slice(0, 10)}, ${number(group.durationMonths)}개월)` });
        } else if (state.status !== "all" && (state.status === "other" ? row.status === "정상" : row.status !== state.status)) {
          excluded.push({ row, reason: `상태 조건 제외 (${row.status || "상태 없음"})` });
        } else {
          targets.push(row);
        }
      }
      return { group, matched, targets, excluded };
    }

    // ─── 화면 렌더링 ───
    function networkLabel(network) {
      return network === "KT" ? "KT망" : network === "MIXED" ? "LG/KT 혼합" : "LG망";

    function networkClass(network) {

    }
    function durationText(months) {

    }
    function renderBenefitSelect() {

      const option = (g) => `<option value="${escapeHtml(g.id)}">${escapeHtml(g.label)}  ·  ${networkLabel(g.network)} · 요금제 ${number(g.plans.length)}개</option>`;
      const active = groups.filter((g) => g.active);
      const ended = groups.filter((g) => !g.active);
      const select = $("benefitSelect");
      select.innerHTML = `<option value="">${groups.length ? "혜택을 선택하세요" : "등록된 혜택이 없습니다"}</option>`
        + active.map(option).join("")
        + (ended.length ? `<optgroup label="종료된 혜택">${ended.map(option).join("")}</optgroup>` : "");
      select.value = state.selectedCategoryId;
      select.disabled = !groups.length;
      $("noBenefitNotice").hidden = groups.length > 0;
      const group = selectedCategory();
      $("benefitMeta").innerHTML = group ? `
        <span>상품코드 <strong>${escapeHtml(group.productCode || "-")}</strong></span>
        <span>${escapeHtml(durationText(group.durationMonths))}</span>
        <span title="${escapeHtml(group.plans.map((p) => `${p.planCode}${p.planName ? " · " + p.planName : ""}`).join("\n"))}">요금제 ${number(group.plans.length)}개 매칭</span>
        ${group.active ? "" : `<span class="pill off">종료된 혜택</span>`}
        <button type="button" class="link-btn" data-edit-selected>조건 수정</button>
      ` : "";
    }
    function renderUploadState() {
      const zone = $("dropZone");
      zone.classList.toggle("busy", state.processing);
      zone.classList.toggle("loaded", !!state.customers.length);
      if (state.processing) {
        $("dzMain").textContent = pendingFile?.name || "파일 처리 중";
        $("dzSub").textContent = "처리 중입니다…";
      } else if (state.customers.length) {
        $("dzMain").textContent = `📄 ${state.fileName}`;
        $("dzSub").textContent = `고객 ${number(state.customers.length)}명 불러옴 · 다른 파일로 바꾸려면 클릭하거나 끌어다 놓으세요`;
      } else if (pendingFile) {

        $("dzSub").textContent = "불러오지 못했습니다 · 암호를 확인하거나 다른 파일을 선택하세요";
      } else {
        $("dzMain").innerHTML = "파일을 끌어다 놓거나 <u>클릭해서 선택</u>하세요";
        $("dzSub").textContent = "엑셀(.xlsx) · 암호화 파일 지원 · 파일은 이 브라우저 안에서만 처리되며 새로고침·초기화 시 삭제됩니다";
      }
    }
    const CUSTOMER_COLUMNS = ["연락처", "고객명", "요금제코드", "요금제명", "개통일", "상태", "개통구분", "대리점", "총판"];
    function renderResults(result) {
      const { group, matched, targets, excluded } = result;
      const loaded = state.customers.length > 0;
      const ready = loaded && !!group;
      $("mTotal").textContent = loaded ? number(state.customers.length) : "-";
      $("mMatched").textContent = ready ? number(matched.length) : "-";
      $("mFinal").textContent = ready ? number(targets.length) : "-";
      $("resultBenefitLabel").textContent = group ? group.label : "";
      $("segTargets").textContent = number(targets.length);
      $("segExcluded").textContent = number(excluded.length);
      $("viewSeg").querySelectorAll("button").forEach((btn) => {

        ? `<option value="">요금제: 전체 (${number(group.plans.length)}개)</option>` + group.plans.map((plan) => `<option value="${escapeHtml(plan.planCode)}">${escapeHtml(plan.planCode)} · ${escapeHtml(plan.planName || "")} (${number(planCounts.get(plan.planCode) || 0)}명)</option>`).join("")

      $("planCode").value = state.planCode;

      const checkEl = $("checkLine");
      if (ready && targets.length) {

        const issues = [];
        if (check.duplicatePhone) issues.push(`중복 전화번호 ${number(check.duplicatePhone)}건`);
        if (check.emptyPhone) issues.push(`빈 전화번호 ${number(check.emptyPhone)}건`);
        if (check.missingRequired) issues.push(`필수값 누락 ${number(check.missingRequired)}건`);
        if (check.unmatchedPlanCode) issues.push(`요금제 미매칭 ${number(check.unmatchedPlanCode)}건`);
        checkEl.className = `check-line ${issues.length ? "bad" : "ok"}`;
        checkEl.textContent = issues.length ? `⚠ 발송 전 확인: ${issues.join(" · ")}` : "✓ 중복·빈 전화번호·필수값 누락 없음";
      } else {
        checkEl.className = "check-line";

      }

      const showReason = state.view === "excluded";
      $("customerHead").innerHTML = `<tr>${CUSTOMER_COLUMNS.map((c) => `<th>${c}</th>`).join("")}${showReason ? "<th>제외 사유</th>" : ""}</tr>`;

      if (query) list = list.filter(({ row }) => [row.phone, row.name, row.status, row.joinType, row.agency, row.channel, row.planCode, row.planName].some((v) => String(v).toLowerCase().includes(query)));
      let emptyText = "";

      else if (!loaded) emptyText = "개통내역 파일을 업로드하면 발송 대상자가 표시됩니다.";

      else if (!list.length && query) emptyText = "검색 결과가 없습니다.";
      else if (!list.length && showReason) emptyText = "제외된 고객이 없습니다.";
      else if (!list.length && !matched.length) emptyText = "업로드한 파일에 이 혜택의 요금제로 개통한 고객이 없습니다.";
      else if (!list.length) emptyText = "발송 대상자가 없습니다. [제외] 탭에서 사유를 확인하세요.";
      const visible = list.slice(0, state.visibleRows);
      $("customerRows").innerHTML = emptyText
        ? `<tr><td colspan="${colspan}" class="empty">${emptyText}</td></tr>`
        : visible.map(({ row, reason }) => `
        <tr>
          <td>${escapeHtml(row.phone)}${!row.phone || !isValidPhoneLike(row.phone) ? `<span class="phone-warn" title="전화번호를 확인해 주세요">⚠</span>` : ""}</td>
          <td>${escapeHtml(row.name)}</td>
          <td>${escapeHtml(row.planCode)}</td>
          <td>${escapeHtml(row.planName)}</td>
          <td>${escapeHtml(row.openedAt)}</td>

          <td>${escapeHtml(row.joinType)}</td>
          <td>${escapeHtml(row.agency)}</td>
          <td>${escapeHtml(row.channel)}</td>
          ${showReason ? `<td class="reason">${escapeHtml(reason)}</td>` : ""}
        </tr>`).join("");
      const remaining = Math.max(0, list.length - visible.length);
      $("rangeLabel").textContent = !emptyText ? `${number(visible.length)}명 표시 / ${number(list.length)}명` : "";
      $("loadMoreRowsBtn").hidden = remaining === 0;

    }
    function renderActionBar(result) {
      const { group, targets } = result;
      const loaded = state.customers.length > 0;
      const allCount = loaded ? targetRowsForAllCategories().length : 0;
      $("downloadBtn").disabled = !targets.length;
      $("downloadMoreBtn").disabled = !targets.length && !allCount;
      $("downloadMenu").querySelector('[data-dl="xls"]').disabled = !targets.length;
      $("downloadMenu").querySelector('[data-dl="all"]').disabled = !allCount;
      $("resetBtn").disabled = !loaded && !pendingFile && !$("passwordInput").value;
      let hint;
      if (state.lastDownloadName) hint = `✓ <strong>${escapeHtml(state.lastDownloadName)}</strong> 다운로드를 시작했습니다.`;
      else if (!group && !loaded) hint = "혜택 선택 → 파일 업로드 → 대상자 확인 → 다운로드";
      else if (!group) hint = "혜택을 선택하세요.";
      else if (!loaded) hint = "개통내역 파일을 업로드하세요.";
      else if (!targets.length) hint = "발송 대상자가 없어 다운로드할 수 없습니다.";
      else hint = `<strong>${escapeHtml(group.label)}</strong> 발송 대상 <strong>${number(targets.length)}명</strong>`;
      $("actionHint").innerHTML = hint;
      $("downloadFallbackLink").hidden = !state.lastDownloadName;
    }
    function render() {
      renderBenefitSelect();
      renderUploadState();
      const result = analyze();
      renderResults(result);
      renderActionBar(result);
    }

    // ─── 발송 파일 생성 (기존 컬럼 구성 유지) ───
    const SHEET_HEADERS = ["No", "연락처", "상품코드", "상품명", "수량", "고객명", "요금제코드", "요금제명", "개통일", "상태", "개통구분"];
    function sheetRowsFor(group, rows) {
      return rows.map((row, index) => [
        index + 1,
        row.phone,
        group.productCode || "",
        group.productName || "",
        1,
        row.name,
        row.planCode,
        row.planName,
        row.openedAt,
        row.status,
        row.joinType
      ]);
    }
    function downloadCsv() {
      const { group, targets: rows } = analyze();
      if (!group || !rows.length) return;
      const csvRows = [["No", "연락처", "상품코드", "상품명", "수량", "고객명", "요금제코드", "요금제명"]];
      rows.forEach((row, index) => csvRows.push([index + 1, row.phone, group.productCode || "", group.productName || group.label, 1, row.name, row.planCode, row.planName]));
      const csv = "﻿" + csvRows.map((cols) => cols.map((value) => `"${String(value ?? "").replaceAll('"', '""')}"`).join(",")).join("\n");
      downloadBlob(`LG_${group.label}_문자발송_${dateStamp()}.csv`, new Blob([csv], { type: "text/csv;charset=utf-8" }));
    }
    function downloadSelectedCategoryExcel() {
      const { group, targets } = analyze();
      if (!group || !targets.length) return;
      htmlWorkbookDownload(`LG_${group.label}_발송대상_${dateStamp()}.xls`, [{ name: group.label, headers: SHEET_HEADERS, rows: sheetRowsFor(group, targets) }]);
    }
    function downloadAllCategoriesExcel() {
      const sheets = [];
      for (const group of categoryGroups()) {
        const rows = sheetRowsFor(group, targetRowsForCategory(group));
        if (rows.length) sheets.push({ name: group.label, headers: SHEET_HEADERS, rows });
      }
      if (!sheets.length) return;
      htmlWorkbookDownload(`LG_전체혜택_발송대상_${dateStamp()}.xls`, sheets);
    }

    // ─── 혜택 관리 팝업 ───
    const mgr = { view: "list", search: "", draft: null, snapshot: "" };

    function onMappingsChanged() {
      const group = selectedCategory();
      if (!group) state.selectedCategoryId = "";
      if (state.planCode && !(group && group.plans.some((p) => p.planCode === state.planCode))) state.planCode = "";
      revokeDownload();
      render();
    }
    function managerDirty() {
      return mgr.view === "edit" && !!mgr.draft && JSON.stringify(mgr.draft) !== mgr.snapshot;
    }
    function confirmDiscard() {
      return !managerDirty() || confirm("저장하지 않은 변경사항이 있습니다. 변경사항을 버릴까요?");
    }
    function updateUnsavedIndicator() {
      $("unsavedIndicator").hidden = !managerDirty();
    }
    function setManagerView(view) {
      mgr.view = view;
      $("managerListView").hidden = view !== "list";
      $("managerEditView").hidden = view !== "edit";
      $("editFoot").hidden = view !== "edit";
      $("editBackBtn").hidden = view !== "edit";
      $("editError").textContent = "";
      updateUnsavedIndicator();
    }
    function openManager(options = {}) {
      if (!$("managerDialog").open) {
        mgr.search = "";
        $("mgrSearch").value = "";
        setMgrNotice("");
        $("managerDialog").showModal();
      }
      if (options.add) openEditor(null);
      else if (options.editId) openEditor(options.editId);
      else showListView();
    }
    function closeManager() {
      if (!confirmDiscard()) return;
      mgr.draft = null;
      $("managerDialog").close();
    }
    function showListView() {
      mgr.draft = null;
      setManagerView("list");
      $("managerTitle").textContent = "혜택 관리";
      renderManagerList();
    }
    function setMgrNotice(text, tone = "info") {
      $("mgrNotice").textContent = text;
      $("mgrNotice").dataset.tone = tone;
    }
    function renderManagerList() {
      const groups = categoryGroups();
      const query = mgr.search.trim().toLowerCase();
      const visible = groups
        .filter((g) => !query
          || [g.label, g.productCode, g.productName].some((v) => (v || "").toLowerCase().includes(query))
          || g.plans.some((p) => (p.planCode || "").toLowerCase().includes(query) || (p.planName || "").toLowerCase().includes(query)))
        .sort((a, b) => (b.active - a.active) || a.label.localeCompare(b.label, "ko"));
      $("mgrSummary").textContent = groups.length ? `혜택 ${number(groups.length)}개 · 요금제 매칭 ${number(state.mappings.length)}건 · 혜택 설정은 이 브라우저에 저장됩니다.` : "";
      if (!visible.length) {
        $("mgrRows").innerHTML = `<tr><td colspan="7" class="empty">${groups.length ? "검색 결과가 없습니다." : "등록된 혜택이 없습니다. [+ 혜택 추가]로 등록하세요."}</td></tr>`;
        return;
      }
      $("mgrRows").innerHTML = visible.map((g) => {
        const index = groups.indexOf(g);
        const sub = [g.productCode, g.productName && g.productName !== g.label ? g.productName : ""].filter(Boolean).join(" · ");
        return `<tr class="${g.active ? "" : "inactive"}">
          <td><div class="b-name">${escapeHtml(g.label)}</div>${sub ? `<div class="b-sub">${escapeHtml(sub)}</div>` : ""}</td>
          <td><span class="pill ${networkClass(g.network)}">${networkLabel(g.network)}</span></td>
          <td>${escapeHtml(durationText(g.durationMonths))}</td>
          <td title="${escapeHtml(g.plans.map((p) => `${p.planCode}${p.planName ? " · " + p.planName : ""}`).join("\n"))}">${number(g.plans.length)}개</td>
          <td><button type="button" class="pill ${g.active ? "on" : "off"}" data-act="toggle" data-i="${index}" title="클릭하여 사용/종료 전환">${g.active ? "사용" : "종료"}</button></td>
          <td class="col-act"><button type="button" class="btn btn-sm" data-act="edit" data-i="${index}">수정</button></td>
          <td class="col-act"><button type="button" class="btn btn-sm btn-danger" data-act="delete" data-i="${index}">삭제</button></td>
        </tr>`;
      }).join("");
    }
    function toggleBenefitActive(group) {
      const next = !group.active;
      for (const item of state.mappings) if (groupKey(item) === group.id) item.active = next;
      saveMappings();
      onMappingsChanged();
      renderManagerList();
    }
    function deleteBenefit(group) {
      if (categoryGroups().length <= 1) {
        alert("마지막 남은 혜택은 삭제할 수 없습니다. 새 혜택을 먼저 추가한 뒤 삭제해 주세요.");
        return;
      }
      if (!confirm(`"${group.label}" 혜택을 삭제할까요?\n\n연결된 요금제 매칭 ${group.plans.length}개가 함께 삭제되며 되돌릴 수 없습니다.\n다른 혜택의 설정은 변경되지 않습니다.`)) return;
      state.mappings = state.mappings.filter((item) => groupKey(item) !== group.id);
      saveMappings();
      onMappingsChanged();
      renderManagerList();
      setMgrNotice(`"${group.label}" 혜택을 삭제했습니다.`, "ok");
    }

    function draftNetworkFromPlans() {
      const networks = new Set(mgr.draft.plans.map((p) => p.network));
      if (networks.size > 1) return "MIXED";
      if (networks.size === 1) return networks.has("KT") ? "KT" : "LG";
      return mgr.draft.network === "KT" ? "KT" : "LG";
    }
    function openEditor(id) {
      const g = id ? categoryGroups().find((x) => x.id === id) : null;
      mgr.draft = g
        ? {
            originalId: g.id,
            label: g.label,
            productCode: g.productCode || "",
            productName: g.productName || "",
            months: g.months ? String(g.months) : "",
            network: g.network,
            active: g.active,
            plans: g.plans.map((p) => ({ planCode: p.planCode, planName: p.planName || "", network: p.network, active: p.active }))
          }
        : { originalId: null, label: "", productCode: "", productName: "", months: "", network: "LG", active: true, plans: [] };
      mgr.snapshot = JSON.stringify(mgr.draft);
      setManagerView("edit");
      $("managerTitle").textContent = g ? "혜택 수정" : "혜택 추가";
      $("ef-label").value = mgr.draft.label;
      $("ef-product-code").value = mgr.draft.productCode;
      $("ef-product-name").value = mgr.draft.productName;
      $("ef-months").value = mgr.draft.months;
      $("ef-active").value = String(mgr.draft.active);
      $("planAddInput").value = "";
      $("planAddMsg").textContent = "";
      $("planSuggest").hidden = true;
      renderEditorDerived();
      renderPlanRows();
      $("managerEditView").scrollTop = 0;
      $("ef-label").focus();
    }
    function renderEditorDerived() {
      const d = mgr.draft;
      const select = $("ef-network");
      select.querySelector('option[value="MIXED"]').hidden = d.network !== "MIXED";
      select.value = d.network;
      $("ef-active").value = String(d.active);
      const labelMonths = benefitMonthsFromLabel(d.label);
      $("ef-months").placeholder = labelMonths ? `비우면 ${labelMonths}개월` : "비우면 제한 없음";
      $("ef-months-hint").textContent = d.months.trim()
        ? `가입 다음 달부터 ${d.months.trim()}개월 지급, 이후 대상에서 자동 제외`
        : (labelMonths ? `비워두면 혜택명 기준 ${labelMonths}개월 적용` : "비워두면 지급기간 제한 없음");
      updateUnsavedIndicator();
    }
    function renderPlanRows() {
      const d = mgr.draft;
      $("planCountLabel").textContent = number(d.plans.length);
      const counts = new Map(state.plans.map((p) => [p.code, p.total]));
      $("planRows").innerHTML = d.plans.length ? d.plans.map((p, pi) => `
        <tr>
          <td class="mono">${escapeHtml(p.planCode)}${counts.get(p.planCode) ? ` <span class="muted">(${number(counts.get(p.planCode))}명)</span>` : ""}</td>
          <td><input class="input plan-name-input" data-pi="${pi}" value="${escapeHtml(p.planName)}" placeholder="요금제명" /></td>
          <td><button type="button" class="pill ${networkClass(p.network)}" data-act="net" data-pi="${pi}" title="클릭하여 LG/KT 전환">${p.network === "KT" ? "KT" : "LG"}</button></td>
          <td><button type="button" class="pill ${p.active ? "on" : "off"}" data-act="active" data-pi="${pi}" title="클릭하여 사용/미사용 전환">${p.active ? "사용" : "미사용"}</button></td>
          <td><button type="button" class="icon-del" data-act="remove" data-pi="${pi}" aria-label="연결 해제" title="이 혜택에서 제외">✕</button></td>
        </tr>`).join("")
        : `<tr><td colspan="5" class="empty">연결된 요금제가 없습니다. 위 입력창에서 요금제를 검색해 추가하세요.</td></tr>`;
      updateUnsavedIndicator();
    }
    function renderSuggest() {
      const box = $("planSuggest");
      const d = mgr.draft;
      if (!d) { box.hidden = true; return; }
      const query = $("planAddInput").value.trim().toLowerCase();
      const connected = new Set(d.plans.map((p) => p.planCode));
      const pool = allKnownPlans()
        .filter((item) => !query || item.code.toLowerCase().includes(query) || (item.name || "").toLowerCase().includes(query))
        .sort((a, b) => (b.count - a.count) || a.code.localeCompare(b.code));
      const list = pool.slice(0, 60);
      box.innerHTML = list.length
        ? list.map((item) => `<div class="suggest-item ${connected.has(item.code) ? "done" : ""}" data-code="${escapeHtml(item.code)}">
            <span class="mono">${escapeHtml(item.code)}</span>
            <span class="name">${escapeHtml(item.name || "(이름 없음)")}</span>
            <span class="tag">${connected.has(item.code) ? "✓ 연결됨" : (item.count ? `${number(item.count)}명` : "")}</span>
          </div>`).join("") + (pool.length > list.length ? `<div class="suggest-empty">외 ${number(pool.length - list.length)}개 · 검색어를 더 입력하세요</div>` : "")
        : `<div class="suggest-empty">일치하는 요금제가 없습니다. 요금제코드를 정확히 입력하고 Enter를 누르면 새 코드로 추가됩니다.</div>`;
      box.hidden = false;
    }
    function addPlanCodes(codes) {
      const d = mgr.draft;
      const pool = new Map(allKnownPlans().map((p) => [p.code, p]));
      let added = 0;
      let duplicated = 0;
      for (const code of codes) {
        if (d.plans.some((p) => p.planCode === code)) { duplicated++; continue; }
        d.plans.push({ planCode: code, planName: pool.get(code)?.name || "", network: d.network === "KT" ? "KT" : "LG", active: d.active });
        added++;
      }
      d.network = draftNetworkFromPlans();
      if (added) $("editError").textContent = "";
      $("planAddMsg").textContent = [added ? `${number(added)}개 추가했습니다.` : "", duplicated ? `${number(duplicated)}개는 이미 연결되어 있습니다.` : ""].filter(Boolean).join(" ");
      renderEditorDerived();
      renderPlanRows();
    }
    function addFromPlanInput() {
      const value = $("planAddInput").value.trim();
      if (!value) return;
      let codes = splitPlanCodes(value);
      if (!codes.length) {
        const known = allKnownPlans();
        const lower = value.toLowerCase();
        const exact = known.find((p) => p.code.toLowerCase() === lower);
        const matches = known.filter((p) => p.code.toLowerCase().includes(lower) || (p.name || "").toLowerCase().includes(lower));
        if (exact) codes = [exact.code];
        else if (matches.length === 1) codes = [matches[0].code];
        else if (/^[A-Za-z0-9_-]+$/.test(value)) codes = [value];
        else {
          $("planAddMsg").textContent = matches.length ? "검색 결과가 여러 개입니다. 목록에서 추가할 요금제를 클릭하세요." : "요금제코드를 찾지 못했습니다.";
          return;
        }
      }
      addPlanCodes(codes);
      $("planAddInput").value = "";
      $("planSuggest").hidden = true;
    }
    function saveDraft() {
      const d = mgr.draft;
      const label = d.label.trim();
      const fail = (message, focusId) => {
        $("editError").textContent = message;
        if (focusId) $(focusId).focus();
        return false;
      };
      if (!label) return fail("혜택명을 입력하세요.", "ef-label");
      if (categoryGroups().some((g) => g.id === label && g.id !== d.originalId)) return fail("같은 이름의 혜택이 이미 있습니다. 다른 혜택명을 입력하세요.", "ef-label");
      const monthsText = d.months.trim();
      const months = Number(monthsText);
      if (monthsText && !(Number.isInteger(months) && months > 0)) return fail("지급 개월수는 1 이상의 정수로 입력하세요. 제한이 없으면 비워두세요.", "ef-months");
      const plans = d.plans.filter((p) => p.planCode.trim());
      if (!plans.length) return fail("연결된 요금제가 없습니다. 요금제를 1개 이상 추가해야 저장할 수 있습니다.", "planAddInput");
      const items = plans.map((p) => ({
        category: label,
        productCode: d.productCode.trim(),
        productName: d.productName.trim(),
        planCode: p.planCode.trim(),
        planName: p.planName.trim(),
        months: monthsText ? months : null,
        network: p.network === "KT" ? "KT" : "LG",
        active: p.active !== false
      }));
      const others = d.originalId ? state.mappings.filter((item) => groupKey(item) !== d.originalId) : state.mappings;
      state.mappings = dedupeMappings([...others, ...items]);
      saveMappings();
      if (d.originalId && state.selectedCategoryId === d.originalId) state.selectedCategoryId = label;
      onMappingsChanged();
      showListView();
      setMgrNotice(`"${label}" 혜택을 저장했습니다.`, "ok");
      return true;
    }

    // ─── 이벤트 연결 ───
    $("benefitSelect").addEventListener("change", (event) => {
      state.selectedCategoryId = event.target.value;
      resetResultFilters();
      revokeDownload();
      render();
    });
    $("benefitMeta").addEventListener("click", (event) => {
      if (event.target.closest("[data-edit-selected]") && state.selectedCategoryId) openManager({ editId: state.selectedCategoryId });
    });
    $("noBenefitAddBtn").addEventListener("click", () => openManager({ add: true }));

    const dropZone = $("dropZone");
    dropZone.addEventListener("click", () => { if (!state.processing) $("fileInput").click(); });
    dropZone.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        if (!state.processing) $("fileInput").click();
      }
    });
    dropZone.addEventListener("dragover", (event) => { event.preventDefault(); dropZone.classList.add("drag"); });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("drag"));
    dropZone.addEventListener("drop", (event) => {
      event.preventDefault();
      dropZone.classList.remove("drag");
      const files = event.dataTransfer?.files;
      if (files?.length > 1) setStatus("파일은 한 번에 1개만 올릴 수 있습니다. 첫 번째 파일을 사용합니다.", "warn");
      processFile(files?.[0]);
    });
    // 페이지 밖에 파일을 떨어뜨려 브라우저가 파일을 여는 것을 막는다.
    window.addEventListener("dragover", (event) => event.preventDefault());
    window.addEventListener("drop", (event) => event.preventDefault());
    $("fileInput").addEventListener("change", (event) => processFile(event.target.files?.[0]));
    $("passwordInput").addEventListener("keydown", (event) => {
      if (event.key === "Enter" && pendingFile) {
        event.preventDefault();
        processFile(pendingFile);
      }
    });
    $("passwordInput").addEventListener("input", () => renderActionBar(analyze()));

    $("viewSeg").addEventListener("click", (event) => {

      state.view = button.dataset.view;
      state.visibleRows = PAGE_SIZE;
      render();

    $("customerSearch").addEventListener("input", (event) => {
      state.search = event.target.value;
      state.visibleRows = PAGE_SIZE;
      renderResults(analyze());
    });
    $("planCode").addEventListener("change", (event) => {
      state.planCode = event.target.value;
      state.visibleRows = PAGE_SIZE;
      revokeDownload();
      render();
    });
    $("statusFilter").addEventListener("change", (event) => {

      state.visibleRows = PAGE_SIZE;
      revokeDownload();
      render();

    $("loadMoreRowsBtn").addEventListener("click", () => {

    $("downloadBtn").addEventListener("click", downloadCsv);
    $("downloadMoreBtn").addEventListener("click", (event) => {
      event.stopPropagation();
      $("downloadMenu").hidden = !$("downloadMenu").hidden;
    });
    $("downloadMenu").addEventListener("click", (event) => {
      const item = event.target.closest("button[data-dl]");

      $("downloadMenu").hidden = true;

      clearSession();
      setStatus("초기화했습니다. 업로드 파일과 고객정보가 모두 삭제되었습니다.", "ok");

    $("openManagerBtn").addEventListener("click", () => openManager());
    $("managerCloseBtn").addEventListener("click", closeManager);
    // ESC는 keydown에서 직접 처리한다. 브라우저 기본 cancel 동작은 연속 입력 시 막을 수 없어 미저장 확인 없이 닫힐 수 있다.
    function handleManagerEscape() {
      if (!$("planSuggest").hidden) { $("planSuggest").hidden = true; return; }
      closeManager();
    }
    $("managerDialog").addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      event.preventDefault();
      handleManagerEscape();

    $("managerDialog").addEventListener("cancel", (event) => {
      event.preventDefault();
      handleManagerEscape();
    });
    $("mgrSearch").addEventListener("input", (event) => {
      mgr.search = event.target.value;
      renderManagerList();
    });
    $("addBenefitBtn").addEventListener("click", () => openEditor(null));
    $("mgrRows").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-act]");
      if (!button) return;
      const group = categoryGroups()[Number(button.dataset.i)];
      if (!group) return;
      if (button.dataset.act === "edit") openEditor(group.id);
      else if (button.dataset.act === "delete") deleteBenefit(group);
      else if (button.dataset.act === "toggle") toggleBenefitActive(group);
    });
    $("importCsvBtn").addEventListener("click", () => $("mappingFileInput").click());
    $("mappingFileInput").addEventListener("change", async (event) => {
      const file = event.target.files?.[0];
      event.target.value = "";
      if (!file) return;
      try {
        const items = mappingRowsToItems(parseCsv(await file.text()));
        if (!items.length) throw new Error("요금제코드 매칭 데이터가 없습니다.");
        const benefitCount = new Set(items.map(groupKey)).size;
        if (!confirm(`현재 등록된 혜택 ${categoryGroups().length}개가 "${file.name}"의 내용(혜택 ${benefitCount}개 / 요금제 ${items.length}건)으로 모두 교체됩니다.\n\n계속할까요?`)) return;
        state.mappings = items;
        saveMappings();
        onMappingsChanged();
        renderManagerList();
        setMgrNotice(`가져오기 완료: 혜택 ${number(benefitCount)}개 / 요금제 ${number(items.length)}건`, "ok");
      } catch (error) {
        setMgrNotice(error.message || "매칭 파일을 읽지 못했습니다.", "error");
      }
    });

    $("editBackBtn").addEventListener("click", () => { if (confirmDiscard()) showListView(); });
    $("editCancelBtn").addEventListener("click", () => { if (confirmDiscard()) showListView(); });
    $("editSaveBtn").addEventListener("click", saveDraft);
    [["ef-label", "label"], ["ef-product-code", "productCode"], ["ef-product-name", "productName"], ["ef-months", "months"]].forEach(([id, key]) => {
      $(id).addEventListener("input", () => {
        mgr.draft[key] = $(id).value;
        $("editError").textContent = "";
        renderEditorDerived();
      });
    });
    $("ef-network").addEventListener("change", (event) => {
      const value = event.target.value;
      if (value === "MIXED") return;
      mgr.draft.network = value;
      mgr.draft.plans.forEach((p) => { p.network = value; });
      renderEditorDerived();
      renderPlanRows();
    });
    $("ef-active").addEventListener("change", (event) => {
      const active = event.target.value === "true";
      mgr.draft.active = active;
      mgr.draft.plans.forEach((p) => { p.active = active; });
      renderEditorDerived();
      renderPlanRows();
    });
    $("planAddInput").addEventListener("input", () => { $("planAddMsg").textContent = ""; renderSuggest(); });
    $("planAddInput").addEventListener("focus", renderSuggest);
    $("planAddInput").addEventListener("blur", () => setTimeout(() => { $("planSuggest").hidden = true; }, 150));
    $("planAddInput").addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        addFromPlanInput();
      }
    });
    $("planAddBtn").addEventListener("click", addFromPlanInput);
    $("planSuggest").addEventListener("mousedown", (event) => event.preventDefault());
    $("planSuggest").addEventListener("click", (event) => {
      const item = event.target.closest(".suggest-item:not(.done)");
      if (!item) return;
      addPlanCodes([item.dataset.code]);
      renderSuggest();
    });
    $("planRows").addEventListener("input", (event) => {
      const input = event.target.closest(".plan-name-input");
      if (!input) return;
      mgr.draft.plans[Number(input.dataset.pi)].planName = input.value;
      updateUnsavedIndicator();
    });
    $("planRows").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-act]");
      if (!button) return;
      const d = mgr.draft;
      const pi = Number(button.dataset.pi);
      const plan = d.plans[pi];
      if (!plan) return;
      if (button.dataset.act === "net") plan.network = plan.network === "KT" ? "LG" : "KT";
      else if (button.dataset.act === "active") plan.active = !plan.active;
      else if (button.dataset.act === "remove") d.plans.splice(pi, 1);
      d.network = draftNetworkFromPlans();
      if (d.plans.length) d.active = d.plans.some((p) => p.active);
      $("editError").textContent = "";
      renderEditorDerived();
      renderPlanRows();
    });

    window.addEventListener("beforeunload", (event) => {
      if (!managerDirty()) return;
      event.preventDefault();
      event.returnValue = "";
    });
    // 뒤로가기/앞으로가기 캐시로 복원되어도 이전 고객정보·입력값이 남지 않도록 비운다.
    window.addEventListener("pageshow", (event) => {
      if (event.persisted) clearSession();
    });

    $("fileInput").value = "";
    $("passwordInput").value = "";
    loadSavedMappings();
    render();
    if (!crypto?.subtle || typeof DecompressionStream === "undefined") {
      setStatus("현재 브라우저에서는 일부 파일 처리 기능이 제한될 수 있습니다. 최신 Chrome 또는 Edge에서 https 주소로 열어 주세요.", "warn");
    }
  </script>
</body>
</html>
